apiVersion: apps/v1
kind: Deployment
metadata:
  name: releasesense-web
  labels:
    app: releasesense
    tier: frontend-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: releasesense
      tier: frontend-backend
  template:
    metadata:
      labels:
        app: releasesense
        tier: frontend-backend
    spec:
      containers:
        - name: web-app
          image: rakshana16/releasesense-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ML_SERVICE_URL
              value: "http://releasesense-ml-service:5001/predict"
            - name: ORACLE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: ORACLE_DB_URL
                  optional: true
            - name: ORACLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: ORACLE_DB_USER
                  optional: true
            - name: ORACLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: ORACLE_DB_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
